# Repo hooks plus devkit's shared hooks (gitleaks, the privacy scan and the oxfmt/oxlint check of
# staged files), pulled in as a remote.
# Install once per clone: bunx lefthook install (bun install runs it through `prepare`).
remotes:
  - git_url: https://github.com/neoromantic/devkit
    ref: v1
    refetch_frequency: 24h
    configs:
      - lefthook/lefthook.yml

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "**/*.{ts,tsx}"
      run: bun run typecheck
