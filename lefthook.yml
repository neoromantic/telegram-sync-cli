# Repo hooks plus devkit's shared hooks (gitleaks and the privacy scan), pulled in as a remote.
# Install once per clone: bunx lefthook install (bun install runs it through `prepare`).
remotes:
  - git_url: https://github.com/neoromantic/devkit
    ref: v1
    refetch_frequency: 24h
    configs:
      - lefthook/lefthook.yml

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "**/*.{js,ts,jsx,tsx,json}"
      run: bun run lint:fix
    typecheck:
      glob: "**/*.{ts,tsx}"
      run: bun run typecheck
