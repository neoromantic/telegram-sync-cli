# Based on devkit's templates/ci.bun.yml (https://github.com/neoromantic/devkit), plus the
# compiled binary smoke test and a weekly canary. Repo-owned: devkit sync leaves this file alone.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  schedule:
    # Weekly canary, Monday 04:00 UTC: Bun canary + latest in-range dependencies.
    - cron: "0 4 * * 1"

permissions: {}

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # check (lint, typecheck, Knip), build, pack, test, test:e2e. pack installs the npm tarball in
  # a clean project and runs `tg --help` and `tg --version` with no Telegram credentials.
  build:
    uses: neoromantic/devkit/.github/workflows/ci-bun.yml@v1
    permissions:
      contents: read
    with:
      e2e: true
      canary: ${{ github.event_name == 'schedule' }}
      pack: true
      pack-args: '[["--help"],["--version"]]'

  hygiene:
    uses: neoromantic/devkit/.github/workflows/hygiene.yml@v1
    permissions:
      contents: read

  # Compile the single-file binary that releases ship and run it with no Telegram credentials.
  binary:
    if: github.event.pull_request.draft != true
    runs-on: ${{ fromJSON('{"true":"oss-linux","false":"ubuntu-latest"}')[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main')] }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Temp files go to the runner's temp dir: tmpfs on oss-linux, where /tmp is on disk
      - name: Use the runner temp dir
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build and run the binary
        run: |
          bun run build
          mkdir -p "$RUNNER_TEMP/home"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/home" ./dist/tg --version
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/home" ./dist/tg --help

  # Weekly only: refresh dependencies to the newest versions their ranges allow and run the
  # offline suites, so upstream breakage shows up before a Renovate PR or a user does.
  latest-deps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON('{"true":"oss-linux","false":"ubuntu-latest"}')[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main')] }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Temp files go to the runner's temp dir: tmpfs on oss-linux, where /tmp is on disk
      - name: Use the runner temp dir
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Update dependencies within their ranges
        run: |
          bun update
          bun pm ls

      # No lint here: a newer Biome changes style rules, which Renovate PRs handle.
      - name: Typecheck and test
        run: |
          bun run typecheck
          bun run test
          bun run test:e2e

  # The one required check for the branch ruleset. It is named exactly "ci".
  ci:
    needs: [build, hygiene, binary, latest-deps]
    if: always() && github.event.pull_request.draft != true
    runs-on: ${{ fromJSON('{"true":"oss-linux","false":"ubuntu-latest"}')[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main')] }}
    permissions: {}
    steps:
      - name: All jobs passed
        # A step `if:` without a status function implies success(), which is false when a
        # needed job was cancelled (say, no runner picked it up). Without always() the step
        # is then skipped and the gate passes.
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
